name: breaktimes
description: "A new Flutter project."
publish_to: 'none'

version: 0.0.1+28

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
    
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  

  google_sign_in: '>=6.1.6 <6.2.2'
  provider: '>=6.1.1 <6.2.0'
  image_picker: ^1.0.7
  flutter_spinkit: ^5.2.1

  
    # Firebase core
  firebase_core: ^3.13.0
  
  
  # Firebase auth
  firebase_auth: ^5.5.2
  
  
  # Firebase storage
  firebase_storage: ^12.4.5
  
  
  # Firestore
  cloud_firestore: ^5.6.6

  firebase_analytics: ^11.5.0
  
  # Firebase Remote Config - 원격 환경 변수 관리
  firebase_remote_config: ^5.4.5
  
  # Firebase app check - Play Integrity API 지원 버전 (최신 안정 버전)
  firebase_app_check: ^0.3.2+7

  cloud_functions: ^5.4.0
  
  # Add js package explicitly
  js: ^0.6.7
  
  
  http: ^1.3.0
  table_calendar: ^3.0.9
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^28.1.41
  go_router: ^13.2.0
  timezone: ^0.9.2
  shared_preferences: ^2.3.5
  url_launcher: ^6.0.12

  flutter_local_notifications: ^18.0.1
  app_settings: ^6.1.1
  flutter_foreground_task: ^9.1.0

  flutter_dotenv: ^5.2.1
  
  google_generative_ai: ^0.4.6
  flutter_screenutil: ^5.9.0


  cupertino_icons: ^1.0.8
  google_fonts: ^4.0.3

  video_player: ^2.9.2
  lottie: ^2.0.0

  flutter_plugin_android_lifecycle: ^2.0.27
  kakao_flutter_sdk: ^1.9.7+3

  event_bus: ^2.0.1
  rxdart: ^0.28.0

  device_info_plus: ^11.4.0
  package_info_plus: ^8.3.0
  permission_handler: ^12.0.0+1

  audioplayers: ^6.0.0
  android_alarm_manager_plus: ^4.0.7

  flutter_native_splash: ^2.4.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.12
  json_serializable: ^6.9.0



flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21
  # 적응형 아이콘 추가 (선택 사항)
  adaptive_icon_background: "#FFBA00" # 현재 웹 배경색과 동일하게 설정
  adaptive_icon_foreground: "assets/icons/icon.png"
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/icons/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icons/icon.png"

flutter:
  uses-material-design: true
  
  # 국제화 기능 활성화
  generate: true
  
  assets:
    - lib/l10n/
    - assets/images/
    - assets/images/tutorial/
    - assets/images/pill/
    - assets/fonts/
    - assets/icons/
    - assets/music/
    
  fonts:
    - family: customFontFamily
      fonts:
        - asset: assets/fonts/SUIT-Regular.ttf
        - asset: assets/fonts/SUIT-Bold.ttf
          weight: 700
        - asset: assets/fonts/SUIT-Medium.ttf
          weight: 500
        - asset: assets/fonts/TmoneyRoundWindExtraBold.ttf
          weight: 800

flutter_native_splash:
  # 배경색 또는 배경 이미지
  color: "#ffffff"  # 원하는 배경색 (흰색으로 설정)
  #background_image: "assets/background.png"  # 배경 이미지 사용 시
  
  # 스플래시 화면에 표시될 이미지
  image: "assets/icons/logo_plover.png"  # 스플래시 이미지 경로
  
  # 이미지 크기 조정 (선택사항)
  #branding: "assets/branding.png"  # 하단에 표시할 브랜딩 이미지
  #branding_mode: bottom  # 브랜딩 표시 위치 (bottom/center)
  
  # 다크 모드 설정 (선택사항)
  color_dark: "#121212"  # 다크 모드 배경색 
  image_dark: "assets/icons/logo_plover.png"  # 다크 모드 이미지 (선택사항)
  
  # Android 12+ 설정
  android_12:
    # Android 12에서는 아이콘과 배경을 별도로 설정합니다
    image: "assets/icons/logo_plover.png"  # 중앙 아이콘
    icon_background_color: "#FFFFFF"  # 아이콘 배경
    image_dark: "assets/icons/logo_plover.png"  # 다크 모드 아이콘
    icon_background_color_dark: "#121212"  # 다크 모드 아이콘 배경
  
  # 웹 설정
  web: true  # 웹 스플래시 활성화
  
  # iOS 설정
  ios: true
  fullscreen: true  # 전체 화면 모드